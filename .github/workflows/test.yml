name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Pure transport mocks: no runtime dependencies, secrets or paid API calls.
      - name: Run unit tests
        run: npm test
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts
